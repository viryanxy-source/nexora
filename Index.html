<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora | O Universo de Mundos</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-color: #0a0a0c;
            --surface-color: rgba(25, 25, 30, 0.6);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0ab;
            --gold-accent: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --fluid-glow: radial-gradient(circle at 50% 50%, rgba(20, 20, 30, 1) 0%, rgba(10, 10, 12, 1) 100%);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif; scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--fluid-glow);
            color: var(--text-primary);
            min-height: 100vh; overflow-x: hidden; line-height: 1.6;
        }

        /* Fundo Fluido */
        .bg-blobs {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; opacity: 0.4; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%;
            filter: blur(100px); animation: float 20s infinite alternate ease-in-out;
        }
        .blob-1 { background: #2a2a35; width: 400px; height: 400px; top: -10%; left: -10%; }
        .blob-2 { background: #d4af37; width: 300px; height: 300px; bottom: 10%; right: -5%; opacity: 0.15; animation-delay: -5s; }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .app-container {
            display: flex; max-width: 1600px; margin: 0 auto;
            padding: 20px; min-height: 100vh; gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 80px; background: var(--surface-color);
            backdrop-filter: blur(16px); border: 1px solid var(--surface-border);
            border-radius: 24px; display: flex; flex-direction: column; align-items: center;
            padding: 30px 0; gap: 30px; position: sticky; top: 20px;
            height: calc(100vh - 40px); z-index: 10;
        }
        .logo-icon {
            color: var(--gold-accent); display: flex; justify-content: center; align-items: center;
            width: 50px; height: 50px; border-radius: 50%;
            border: 2px solid var(--gold-accent); box-shadow: 0 0 15px var(--gold-glow); cursor: pointer;
        }
        .nav-icons { display: flex; flex-direction: column; gap: 25px; }
        .nav-icons a {
            color: var(--text-secondary); transition: 0.3s; display: flex;
            justify-content: center; align-items: center; padding: 10px; border-radius: 12px; cursor: pointer;
        }
        .nav-icons a:hover, .nav-icons a.active {
            color: var(--gold-accent); background: rgba(212, 175, 55, 0.1); transform: scale(1.1);
        }

        .main-content { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }

        /* Topbar */
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface-color); backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border); padding: 15px 30px;
            border-radius: 20px; position: relative; z-index: 20;
        }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a, .nav-links button {
            color: var(--text-secondary); text-decoration: none; font-weight: 400;
            font-size: 0.95rem; transition: 0.3s; background: none; border: none; cursor: pointer; font-family: inherit;
        }
        .nav-links a:hover, .nav-links button:hover, .nav-links .active { color: var(--text-primary); font-weight: 600; }

        .user-actions { display: flex; align-items: center; gap: 20px; }
        .btn-primary {
            background: var(--text-primary); color: var(--bg-color); padding: 10px 24px;
            border-radius: 30px; text-decoration: none; font-weight: 600; font-size: 0.9rem;
            transition: 0.3s; display: flex; align-items: center; gap: 8px; border: none; cursor: pointer;
        }
        .btn-primary:hover { background: var(--gold-accent); color: #000; box-shadow: 0 0 20px var(--gold-glow); }
        .user-profile { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); font-size: 0.9rem; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #333, #d4af37);
            display: flex; justify-content: center; align-items: center; color: white; font-weight: bold;
        }

        /* Menu Mobile */
        .menu-toggle {
            display: none; background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border);
            color: var(--text-primary); padding: 8px; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .menu-toggle:hover { background: rgba(255,255,255,0.1); }
        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 250px; height: 100vh;
            background: rgba(15, 15, 20, 0.98); backdrop-filter: blur(20px);
            border-left: 1px solid var(--surface-border); z-index: 100;
            display: flex; flex-direction: column; padding: 40px 20px;
            transition: right 0.4s ease; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu .close-btn {
            align-self: flex-end; background: none; border: none;
            color: var(--text-secondary); cursor: pointer; margin-bottom: 30px;
        }
        .mobile-menu a, .mobile-menu button {
            color: var(--text-primary); text-decoration: none; font-size: 1.1rem;
            padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s; display: flex; align-items: center; gap: 10px;
            background: none; border: none; font-family: inherit; text-align: left; cursor: pointer;
        }
        .mobile-menu a:hover, .mobile-menu button:hover { color: var(--gold-accent); padding-left: 10px; }

        /* SISTEMA DE TELAS (SPA) */
        .page-section { display: none; animation: fadeIn 0.5s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* HOME */
        .hero-section {
            background: linear-gradient(to right, rgba(10, 10, 12, 0.9) 0%, rgba(10, 10, 12, 0.2) 100%), 
                        url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            background-color: #1a1a24; border-radius: 28px; padding: 60px 40px;
            min-height: 400px; display: flex; flex-direction: column; justify-content: center;
            position: relative; overflow: hidden; border: 1px solid var(--surface-border);
        }
        .hero-content { max-width: 600px; z-index: 2; }
        .tag {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(212, 175, 55, 0.1);
            color: var(--gold-accent); padding: 6px 16px; border-radius: 20px; font-size: 0.8rem;
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 20px; border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .hero-title { font-family: 'Cinzel', serif; font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .hero-subtitle { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 30px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .hero-buttons { display: flex; gap: 15px; }
        .btn-outline {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            color: var(--text-primary); border: 1px solid var(--surface-border);
            padding: 12px 30px; border-radius: 30px; font-weight: 600; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.2); border-color: var(--text-primary); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 20px; }
        .section-title { font-size: 1.5rem; font-weight: 600; }
        .btn-text { color: var(--text-secondary); font-size: 0.9rem; background: rgba(255,255,255,0.05); padding: 6px 16px; border-radius: 20px; transition: 0.3s; cursor: pointer; border: none; }
        .btn-text:hover { color: var(--text-primary); background: rgba(255,255,255,0.1); }

        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card {
            background: var(--surface-color); backdrop-filter: blur(16px); border: 1px solid var(--surface-border);
            border-radius: 20px; padding: 20px; transition: 0.4s; position: relative; overflow: hidden; cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); border-color: rgba(212, 175, 55, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; margin-bottom: 15px; color: var(--gold-accent); }
        .card h3 { font-size: 1.1rem; margin-bottom: 10px; }
        .card p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4; }

        .about-section {
            display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center;
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 28px; padding: 40px; margin-top: 20px;
        }
        .about-text h2 { font-family: 'Cinzel', serif; font-size: 2rem; margin-bottom: 20px; color: var(--gold-accent); }
        .about-text p { color: var(--text-secondary); margin-bottom: 15px; }
        .about-visual {
            height: 400px; border-radius: 20px; background: #1a1a24 url('mare.jpg') center top/cover no-repeat;
            border: 1px solid var(--surface-border); position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8); cursor: pointer; transition: 0.3s;
        }
        .about-visual:hover { transform: scale(1.02); border-color: var(--gold-accent); }

        /* TELAS INTERNAS (Cabeçalho Voltar) */
        .page-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .btn-back {
            background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border);
            color: var(--text-primary); padding: 10px; border-radius: 12px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .btn-back:hover { background: var(--gold-accent); color: black; }
        .page-title { font-family: 'Cinzel', serif; font-size: 2.5rem; color: var(--gold-accent); }

        /* TELA LORE (Quadrados) */
        .lore-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-top: 20px; }
        .lore-square {
            background: rgba(30, 30, 35, 0.4); backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border); border-radius: 24px;
            padding: 50px 30px; text-align: center; cursor: pointer; transition: 0.4s;
            display: flex; flex-direction: column; align-items: center; box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
        }
        .lore-square:hover {
            transform: translateY(-10px); border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(212, 175, 55, 0.1);
            background: rgba(40, 40, 48, 0.6);
        }
        .lore-icon {
            width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #1f1f24, #2d2d35);
            display: flex; justify-content: center; align-items: center; margin-bottom: 25px; color: var(--gold-accent);
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .lore-square h3 { font-family: 'Cinzel', serif; font-size: 1.6rem; margin-bottom: 10px; color: var(--text-primary); }
        .lore-square p { color: var(--text-secondary); font-size: 0.95rem; }

        /* TELA PERSONAGENS */
        .character-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .char-card {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 20px; overflow: hidden; cursor: pointer; transition: 0.3s; text-align: center; padding-bottom: 20px;
        }
        .char-card:hover { border-color: var(--gold-accent); transform: scale(1.03); }
        .char-img { height: 300px; background: #1a1a24 url('mare.jpg') center top/cover; border-bottom: 1px solid var(--surface-border); }
        .char-card h3 { margin-top: 15px; font-family: 'Cinzel', serif; color: var(--gold-accent); font-size: 1.3rem; }
        .char-card p { color: var(--text-secondary); font-size: 0.85rem; }

        /* TELA LIVROS */
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        .book-card {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s;
            border-left: 4px solid var(--gold-accent);
        }
        .book-card:hover { background: rgba(255,255,255,0.05); transform: translateY(-5px); }
        .book-card i { color: var(--gold-accent); margin-bottom: 15px; }
        .book-card h3 { font-size: 1.1rem; margin-bottom: 5px; }
        .book-card span { font-size: 0.8rem; color: var(--text-secondary); }

        /* Modais */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #121216; border: 1px solid var(--gold-accent); border-radius: 24px;
            width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto;
            position: relative; transform: translateY(20px); transition: 0.4s ease; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-close {
            position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1);
            border: none; color: white; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 10; transition: 0.3s;
        }
        .modal-close:hover { background: var(--gold-accent); color: black; }
        .modal-hero {
            height: 350px; background: #000 url('mare.jpg') center 20%/cover no-repeat;
            border-radius: 24px 24px 0 0; position: relative;
        }
        .modal-hero::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 150px;
            background: linear-gradient(to top, #121216, transparent);
        }
        .modal-body { padding: 30px; }
        .modal-body h2 { font-family: 'Cinzel', serif; color: var(--gold-accent); font-size: 2.2rem; margin-bottom: 5px; }
        .modal-body .subtitle { color: var(--text-secondary); font-style: italic; margin-bottom: 20px; }
        .modal-body p { margin-bottom: 15px; color: #ccc; }
        
        .modal-simple { padding: 50px 30px; text-align: center; }
        .modal-simple i { color: var(--gold-accent); margin-bottom: 20px; }
        .modal-simple h2 { font-family: 'Cinzel', serif; font-size: 2rem; color: var(--text-primary); margin-bottom: 10px; }
        .modal-simple p { color: var(--text-secondary); }

        /* Rodapé */
        footer {
            margin-top: 40px; padding: 40px; background: var(--surface-color);
            border: 1px solid var(--surface-border); border-radius: 28px;
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 30px;
        }
        .footer-col h4 { margin-bottom: 15px; color: var(--text-primary); }
        .footer-col p, .footer-col a {
            color: var(--text-secondary); text-decoration: none; display: block;
            margin-bottom: 10px; font-size: 0.9rem; transition: 0.3s; cursor: pointer;
        }
        .footer-col a:hover { color: var(--gold-accent); }
        .copyright {
            width: 100%; text-align: center; margin-top: 20px; padding-top: 20px;
            border-top: 1px solid var(--surface-border); color: var(--text-secondary);
            font-size: 0.8rem; line-height: 1.5;
        }

        /* Responsividade */
        @media (max-width: 1024px) {
            .about-section { grid-template-columns: 1fr; }
            .hero-title { font-size: 2.5rem; }
        }
        @media (max-width: 768px) {
            .app-container { flex-direction: column; padding: 10px; padding-top: 20px; }
            .sidebar { display: none; }
            .topbar { padding: 15px 20px; }
            .nav-links { display: none; }
            .menu-toggle { display: block; }
            .hero-section { padding: 40px 20px; min-height: auto; }
            .hero-title { font-size: 2rem; }
            .hero-buttons { flex-direction: column; }
            footer { flex-direction: column; padding: 20px; }
            .about-visual { height: 300px; }
            .modal-hero { height: 250px; }
            .page-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Menu Mobile -->
    <div class="mobile-menu" id="mobileMenu">
        <button class="close-btn" onclick="toggleMenu()">
            <i data-lucide="x" size="28"></i>
        </button>
        <a onclick="toggleMenu(); switchPage('home')"><i data-lucide="home" size="18"></i> Início</a>
        <a onclick="toggleMenu(); switchPage('lore')"><i data-lucide="book-open" size="18"></i> A Biblioteca</a>
        <a href="#contato" onclick="toggleMenu(); switchPage('home')"><i data-lucide="mail" size="18"></i> Contato</a>
    </div>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="logo-icon" title="Nexora" onclick="switchPage('home')">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                    <path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6"/>
                    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4"/>
                </svg>
            </div>
            <nav class="nav
